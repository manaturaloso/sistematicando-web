name: Site and CMS quality

on:
  push:
    branches: [feat/feature-catalog]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove evidence from older runs
        run: rm -f docs/qa/site-report.json docs/qa/accessibility-report.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Check types and content
        run: npm run check
      - name: Build and dry-run Worker (never deploy)
        run: npm run worker:check
      - name: Install browser for local checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Check pages, navigation and accessibility
        run: npm run test:ci
      - name: Save build and quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-quality-${{ github.sha }}
          path: |
            dist/
            docs/qa/site-report.json
            docs/qa/accessibility-report.json
          if-no-files-found: warn
          retention-days: 7
