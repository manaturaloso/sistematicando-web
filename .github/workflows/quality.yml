name: Site and CMS quality

on:
  push:
    branches: [feat/feature-catalog]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove evidence from older runs
        run: rm -f docs/qa/site-report.json docs/qa/accessibility-report.json docs/qa/brand-report.json docs/qa/modules-report.json docs/qa/resources-report.json docs/qa/legal-report.json docs/qa/release-report.json docs/qa/release-guards-report.json docs/qa/compatibility-report.json docs/RELEASE_CHECKLIST.md docs/qa/pricing-report.json docs/qa/admin-report.json docs/qa/visual-editor-report.json docs/qa/visual-editor-security-report.json docs/qa/visual-auth-report.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Check internal pricing arithmetic
        run: python3 scripts/test-pricing-economics.py
      - name: Check visual editor security in isolated fixtures
        run: node scripts/test-visual-editor.mjs
      - name: Check hosted visual authentication with synthetic responses
        run: node scripts/test-visual-auth.mjs
      - name: Check types and content
        run: npm run check
      - name: Build and dry-run Worker (never deploy)
        run: npm run worker:check
      - name: Install browser engines for checks
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Check real local visual editing (restore source, never push)
        run: |
          trap 'npx --no-install astro dev stop' EXIT
          npm run dev -- --port 4321 --background
          node scripts/verify-visual-editor.mjs
      - name: Check pages, navigation, branding and accessibility
        env:
          COMPAT_REQUIRED_ENGINES: chromium,firefox,webkit
        run: npm run test:ci
      - name: Save build and quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-quality-${{ github.sha }}
          path: |
            dist/
            docs/qa/site-report.json
            docs/qa/accessibility-report.json
            docs/qa/brand-report.json
            docs/qa/modules-report.json
            docs/qa/resources-report.json
            docs/qa/legal-report.json
            docs/qa/compatibility-report.json
            docs/qa/pricing-report.json
            docs/qa/admin-report.json
            docs/qa/visual-editor-report.json
            docs/qa/visual-editor-security-report.json
            docs/qa/visual-auth-report.json
            docs/qa/release-report.json
            docs/qa/release-guards-report.json
            docs/RELEASE_CHECKLIST.md
          if-no-files-found: warn
          retention-days: 7
